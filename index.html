<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class="scoreboard">
                <div class="home"><h2 id="homeScore">0</h2></div>
                
                <div class="buttons">
                <button class="reset-btn" id="scoreReset" onclick="resetHomeScore()">Reset</button>
                <button class="click-btn" id="homeAddPlus1" onclick="homeScorePlus1()">+ 1</button>
                <button class="click-btn" id="homeAddPlus2" onclick="homeScorePlus2()">+ 2</button>
                <button class="click-btn" id="homeAddPlus3" onclick="homeScorePlus3()">+ 3</button>
                </div>
                </div>

            </div>
            <div>
                <h3>GUEST</h3>
                <div class="scoreboard">
               <div class="guest"><h2 id="guestScore">0</h2></div>
                
                <div class="buttons">
                <button class="reset-btn" id="scoreReset" onclick="resetGuestScore()">Reset</button>
                <button class="click-btn" id="guestAddPlus1" onclick="guestScorePlus1()">+ 1</button>
                <button class="click-btn" id="guestAddPlus2" onclick="guestScorePlus2()">+ 2</button>
                <button class="click-btn" id="guestAddPlus3" onclick="guestScorePlus3()">+ 3</button>
            </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
